# Fabrica AFX para la futura app AnimeFox (hermana de la fabrica
# MFX de MangaFox, ecosistemas 100% separados: llaves, api e
# index propios). En cada push a main que toque una extension, la
# superficie api/ o el build:
#   1. Compila (Kotlin 2.2.10, wrapper Gradle 8.4).
#   2. Ensambla TODAS las extensiones (auto-descubiertas por
#      settings.gradle.kts): jar -> d8 -> zip con la tarea raiz
#      construirTodas (100% JDK).
#   3. Firma ECDSA P-256 con la llave privada del secret
#      ANIMEFOX_LLAVE_PRIVADA y AUTO-VERIFICA cada .afx contra
#      firmas/llave-publica.pem (la que la APK AnimeFox pineara
#      en ClavesAnimeFox cuando exista).
#   4. Publica: index.json en main + .afx en la rama builds.
# MODO ESPERA: sin extensiones afx/<id>/ todavia, la corrida es
# verde y no publica nada. La primera extension la despierta sola.
# Hardening: actions pineadas por SHA, permisos minimos, timeout.
name: build-afx

on:
  push:
    branches: [main]
    paths: ["afx/**", "api/**", "index.json", "settings.gradle.kts",
            "build.gradle.kts", "gradle.properties", "firmas/**",
            ".github/workflows/build-afx.yml"]
  workflow_dispatch:

concurrency:
  group: build-afx
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - name: Checkout extensiones
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: JDK 17
        uses: actions/setup-java@3a4f6e1af504cf6a31855fa899c6aa5355ba6c12 # v4.7.0
        with:
          distribution: temurin
          java-version: "17"

      - name: Plataforma y build-tools (SDK del runner)
        run: |
          if [ -z "$ANDROID_HOME" ]; then
            echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> "$GITHUB_ENV"
            export ANDROID_HOME=/usr/local/lib/android/sdk
          fi
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          [ -x "$SDKMANAGER" ] || SDKMANAGER=sdkmanager
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          yes | "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" >/dev/null

      - name: Ensamblar, firmar y auto-verificar
        env:
          ANIMEFOX_LLAVE_PRIVADA: ${{ secrets.ANIMEFOX_LLAVE_PRIVADA }}
        run: |
          set -e
          # La tarea Gradle exige PEM PKCS#8; el secret puede ser
          # SEC1 (BEGIN EC PRIVATE KEY): se normaliza aqui.
          printf '%s' "$ANIMEFOX_LLAVE_PRIVADA" > llave-raw.pem
          if grep -q "BEGIN PRIVATE KEY" llave-raw.pem; then
            mv llave-raw.pem llave-afx.pem
          else
            openssl pkcs8 -topk8 -nocrypt -in llave-raw.pem -out llave-afx.pem
          fi
          chmod +x gradlew
          # UNA sola llamada: construirTodas auto-descubre todos los
          # afx/<id>/ y corre su construirAfx. Sin modulos: modo
          # espera (verde, no publica).
          ./gradlew --no-daemon construirTodas \
            -PsdkAndroid="$ANDROID_HOME" \
            -PllaveAfx="$PWD/llave-afx.pem"
          rm -f llave-raw.pem llave-afx.pem

      - name: Publicar index en main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet index.json; then
            echo "index sin cambios"
          else
            PUBLICADAS=$(ls afx/*/build/afx/*.afx 2>/dev/null | sed 's|.*/\([^.]*\)\.afx|\1|' | tr '\n' ' ')
            git add index.json
            git commit -m "build(afx): publicados por CI [skip ci]: ${PUBLICADAS}"
            git push
          fi

      - name: Publicar .afx en rama builds
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p pub/afx
          # Glob: todos los .afx construidos, sin listar modulos.
          # Modo espera: sin .afx no se publica nada (verde).
          AFXS=$(ls afx/*/build/afx/*.afx 2>/dev/null)
          if [ -z "$AFXS" ]; then
            echo "fabrica en espera: nada que publicar"
            exit 0
          fi
          cp $AFXS pub/afx/
          cd pub
          git init -q
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -q -b builds
          git add afx
          git commit -q -m "build afx: firmados y verificados ($(ls afx/ | tr '\n' ' '))"
          git push -q -f "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" builds
